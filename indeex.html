<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JEE Recall — Handwritten Flashcards & Active Revision</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Top Bar -->
  <header class="topbar">
    <div class="brand" id="brandHomeBtn" title="Go to Dashboard">
      <div class="brand-mark">JR</div>
      <span>JEE Recall</span>
    </div>

    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="globalSearchInput" class="search-input" placeholder="Search folders or subjects..." autocomplete="off" />
      <button type="button" id="searchClearBtn" class="search-clear hidden" aria-label="Clear search">&times;</button>
    </div>

    <div class="topbar-actions">
      <button type="button" id="syncStatusPill" class="sync-pill local" title="Cloud Sync & Firebase Setup">
        <span class="sync-dot"></span>
        <span class="sync-text" id="syncStatusText">Local Preview</span>
      </button>
      <button type="button" id="soundToggleBtn" class="icon-btn" title="Toggle Keypress Sounds" aria-label="Toggle sounds"></button>
      <button type="button" id="themeToggleBtn" class="icon-btn" title="Toggle Dark/Light Theme" aria-label="Toggle theme"></button>
      <button type="button" id="backupBtn" class="icon-btn" title="Export / Import Backup" aria-label="Backup">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button type="button" id="accountBtn" class="btn btn-secondary" style="height:36px;padding:0 12px;font-size:0.82rem;">Account</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-container">
    <nav class="nav-tabs" aria-label="Primary views">
      <button type="button" class="nav-tab active" data-view="dashboard">Dashboard</button>
      <button type="button" class="nav-tab" data-view="analytics">Revision Analytics</button>
      <button type="button" class="nav-tab" data-view="setup">Firebase Setup</button>
    </nav>

    <!-- Dashboard View -->
    <section id="dashboardView" class="subjects-grid"></section>

    <!-- Folder View -->
    <section id="folderView" class="hidden"></section>

    <!-- Analytics View -->
    <section id="analyticsView" class="hidden"></section>

    <!-- Firebase Setup View -->
    <section id="setupView" class="hidden"></section>
  </main>

  <!-- Floating Add Card Button (visible inside Folder View) -->
  <button type="button" id="fabAddCard" class="fab hidden" title="Create Handwritten Flashcard" aria-label="Add flashcard">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <!-- Full-Screen Handwritten Card Creator -->
  <div id="creatorOverlay" class="creator-overlay hidden" role="dialog" aria-modal="true" aria-label="Handwritten Card Creator">
    <div class="creator-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <button type="button" id="creatorCloseBtn" class="icon-btn" title="Close Editor">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <span id="creatorTitle" style="font-weight:600;font-size:0.95rem;">New Flashcard</span>
      </div>

      <div class="step-pills">
        <button type="button" class="step-pill active" id="stepQuestionBtn">1. Question</button>
        <button type="button" class="step-pill" id="stepAnswerBtn">2. Answer</button>
      </div>

      <span id="draftStatusLabel" style="font-size:0.76rem;color:var(--text-muted);">Draft saved</span>
    </div>

    <div class="creator-toolbar">
      <div class="tool-group">
        <button type="button" class="tool-btn active" data-tool="pen" title="Pen">Pen</button>
        <button type="button" class="tool-btn" data-tool="highlighter" title="Highlighter">Highlight</button>
        <button type="button" class="tool-btn" data-tool="eraser" title="Stroke Eraser">Eraser</button>
      </div>

      <div class="tool-group">
        <label for="brushSizeInput" style="font-size:0.75rem;color:var(--text-muted);margin-right:4px;">Size</label>
        <input type="range" id="brushSizeInput" min="1" max="16" value="3" style="width:76px;" />
        <span id="brushSizeVal" style="font-size:0.75rem;min-width:20px;text-align:center;">3</span>
      </div>

      <div class="tool-group" id="colorPaletteGroup">
        <input type="color" id="customColorInput" value="#18181b" title="Custom Color" style="width:28px;height:28px;border:none;background:none;cursor:pointer;" />
      </div>

      <div class="tool-group">
        <button type="button" id="undoBtn" class="tool-btn" title="Undo">Undo</button>
        <button type="button" id="redoBtn" class="tool-btn" title="Redo">Redo</button>
        <button type="button" id="clearCanvasBtn" class="tool-btn" title="Clear Canvas">Clear</button>
      </div>

      <div class="tool-group">
        <button type="button" id="zoomOutBtn" class="tool-btn" title="Zoom Out">-</button>
        <button type="button" id="zoomResetBtn" class="tool-btn" title="Reset Zoom">100%</button>
        <button type="button" id="zoomInBtn" class="tool-btn" title="Zoom In">+</button>
      </div>

      <div class="tool-group">
        <select id="paperBgSelect" class="form-input" style="height:32px;padding:0 8px;font-size:0.78rem;width:auto;">
          <option value="plain">Plain Paper</option>
          <option value="grid">Grid Paper</option>
          <option value="dots">Dotted Paper</option>
        </select>
        <button type="button" id="stylusOnlyBtn" class="tool-btn" title="Palm Rejection: Stylus Only">Stylus Only</button>
      </div>
    </div>

    <div class="creator-stage">
      <div class="canvas-paper-wrap">
        <canvas id="drawingCanvas" class="drawing-canvas"></canvas>
      </div>
    </div>

    <div class="creator-footer">
      <button type="button" id="creatorPrevBtn" class="btn btn-secondary" disabled>Previous (Question)</button>
      <div style="display:flex;gap:10px;">
        <button type="button" id="creatorNextBtn" class="btn btn-secondary">Next (Answer)</button>
        <button type="button" id="creatorSaveBtn" class="btn btn-primary">Save Flashcard</button>
      </div>
    </div>
  </div>

  <!-- Distraction-Free Study Mode -->
  <div id="studyOverlay" class="study-overlay hidden" role="dialog" aria-modal="true" aria-label="Study Mode">
    <div class="study-header">
      <div style="display:flex;align-items:center;gap:12px;">
        <button type="button" id="studyExitBtn" class="btn btn-secondary" style="height:34px;padding:0 12px;">
          Exit <span class="kbd-hint">Esc</span>
        </button>
        <div>
          <div id="studyFolderTitle" style="font-weight:600;font-size:0.95rem;"></div>
          <div id="studyCounter" style="font-size:0.78rem;color:var(--text-muted);font-family:'JetBrains Mono',monospace;">1 / 1</div>
        </div>
      </div>

      <button type="button" id="studyRandomBtn" class="btn btn-secondary" style="height:34px;padding:0 12px;">
        Shuffle: Off
      </button>
    </div>

    <div class="study-progress-line">
      <div class="study-progress-fill" id="studyProgressBar" style="width:0%"></div>
    </div>

    <div class="study-stage">
      <div class="study-card-shell">
        <div class="study-face">
          <span class="study-face-label">Question</span>
          <canvas id="studyQuestionCanvas" class="study-canvas"></canvas>
        </div>

        <div id="studyAnswerWrap" class="study-face study-answer-wrap hidden">
          <span class="study-face-label">Answer</span>
          <canvas id="studyAnswerCanvas" class="study-canvas"></canvas>
        </div>
      </div>
    </div>

    <div class="study-controls">
      <button type="button" id="studyPrevBtn" class="btn btn-secondary">
        &larr; Previous <span class="kbd-hint">&larr;</span>
      </button>

      <div id="studyRevealWrap">
        <button type="button" id="studyRevealBtn" class="btn btn-primary" style="min-width:180px;">
          Show Answer <span class="kbd-hint" style="color:#111;">Space</span>
        </button>
      </div>

      <div id="studyFeedbackWrap" class="feedback-group hidden">
        <button type="button" class="fb-btn fb-forgot" data-rate="forgotten">Didn't Know</button>
        <button type="button" class="fb-btn fb-difficult" data-rate="difficult">Difficult</button>
        <button type="button" class="fb-btn fb-knew" data-rate="knew">Knew It</button>
      </div>

      <button type="button" id="studyNextBtn" class="btn btn-secondary">
        Next &rarr; <span class="kbd-hint">&rarr;</span>
      </button>
    </div>
  </div>

  <!-- Generic Modal Container -->
  <div id="modalBackdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modalContent"></div>
  </div>

  <!-- Toast Stack -->
  <div id="toastStack" class="toast-stack" aria-live="polite"></div>

  <input type="file" id="importFileInput" accept=".json,application/json" class="hidden" />
  <script type="module" src="js/app.js"></script>
</body>
</html>
