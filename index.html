<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JEE Recall — Handwritten Flashcards & Active Revision</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg-app: #f7f7f5;
  --bg-surface: #ffffff;
  --bg-surface-hover: #f1f1ee;
  --bg-elevated: #ffffff;
  --bg-muted: #ecece8;
  --text-primary: #191918;
  --text-secondary: #5f5e5a;
  --text-muted: #8c8b85;
  --border-subtle: #e5e5e0;
  --border-strong: #d1d0c9;

  --accent-primary: #2563eb;
  --accent-primary-hover: #1d4ed8;
  --accent-soft: rgba(37, 99, 235, 0.1);

  --math-accent: #4f46e5;
  --math-soft: rgba(79, 70, 229, 0.1);
  --chem-accent: #059669;
  --chem-soft: rgba(5, 150, 105, 0.1);
  --phys-accent: #d97706;
  --phys-soft: rgba(217, 119, 6, 0.1);

  --status-knew: #16a34a;
  --status-knew-bg: rgba(22, 163, 74, 0.12);
  --status-difficult: #d97706;
  --status-difficult-bg: rgba(217, 119, 6, 0.12);
  --status-forgotten: #dc2626;
  --status-forgotten-bg: rgba(220, 38, 38, 0.12);
  --status-new: #64748b;
  --status-new-bg: rgba(100, 116, 139, 0.12);

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.1);

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --transition: 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

[data-theme="dark"] {
  --bg-app: #121211;
  --bg-surface: #1b1b19;
  --bg-surface-hover: #242421;
  --bg-elevated: #222220;
  --bg-muted: #292926;
  --text-primary: #f2f2ef;
  --text-secondary: #a8a7a0;
  --text-muted: #76756f;
  --border-subtle: #2c2c28;
  --border-strong: #3d3d37;

  --accent-primary: #3b82f6;
  --accent-primary-hover: #60a5fa;
  --accent-soft: rgba(59, 130, 246, 0.15);

  --math-accent: #818cf8;
  --math-soft: rgba(129, 140, 248, 0.14);
  --chem-accent: #34d399;
  --chem-soft: rgba(52, 211, 153, 0.14);
  --phys-accent: #fbbf24;
  --phys-soft: rgba(251, 191, 36, 0.14);

  --status-knew: #4ade80;
  --status-knew-bg: rgba(74, 222, 128, 0.14);
  --status-difficult: #fbbf24;
  --status-difficult-bg: rgba(251, 191, 36, 0.14);
  --status-forgotten: #f87171;
  --status-forgotten-bg: rgba(248, 113, 113, 0.14);
  --status-new: #94a3b8;
  --status-new-bg: rgba(148, 163, 184, 0.14);

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 14px 36px rgba(0, 0, 0, 0.45);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background-color: var(--bg-app);
  color: var(--text-primary);
  line-height: 1.5;
  min-height: 100vh;
  transition: background-color var(--transition), color var(--transition);
}

button, input, textarea, select {
  font-family: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
}

.hidden {
  display: none !important;
}

/* Top Navigation */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  padding: 0 20px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: -0.02em;
  cursor: pointer;
  white-space: nowrap;
}

.brand-mark {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--text-primary);
  color: var(--bg-surface);
  display: grid;
  place-items: center;
  font-size: 0.85rem;
  font-weight: 700;
}

.search-wrap {
  flex: 1;
  max-width: 420px;
  position: relative;
}

.search-input {
  width: 100%;
  height: 38px;
  padding: 0 34px 0 36px;
  border-radius: 10px;
  border: 1px solid var(--border-subtle);
  background: var(--bg-app);
  font-size: 0.875rem;
  transition: border-color var(--transition), background-color var(--transition);
}

.search-input:focus {
  outline: none;
  border-color: var(--accent-primary);
  background: var(--bg-surface);
}

.search-icon {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
}

.search-clear {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 22px;
  height: 22px;
  border-radius: 6px;
  color: var(--text-muted);
  display: grid;
  place-items: center;
}

.search-clear:hover {
  background: var(--bg-muted);
  color: var(--text-primary);
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.sync-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 500;
  border: 1px solid var(--border-subtle);
  background: var(--bg-app);
  color: var(--text-secondary);
  white-space: nowrap;
}

.sync-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--status-knew);
}

.sync-pill.offline .sync-dot { background: var(--status-forgotten); }
.sync-pill.local .sync-dot { background: var(--status-difficult); }
.sync-pill.syncing .sync-dot { background: var(--accent-primary); animation: pulse 1s infinite; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  color: var(--text-secondary);
  border: 1px solid transparent;
  transition: background-color var(--transition), color var(--transition);
}

.icon-btn:hover {
  background: var(--bg-surface-hover);
  color: var(--text-primary);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 38px;
  padding: 0 14px;
  border-radius: 10px;
  font-size: 0.875rem;
  font-weight: 500;
  transition: all var(--transition);
  white-space: nowrap;
}

.btn-primary {
  background: var(--text-primary);
  color: var(--bg-surface);
}

.btn-primary:hover {
  opacity: 0.9;
}

.btn-secondary {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
}

.btn-secondary:hover {
  background: var(--bg-surface-hover);
  border-color: var(--border-strong);
}

.btn-danger {
  background: var(--status-forgotten-bg);
  color: var(--status-forgotten);
}

.btn-danger:hover {
  background: var(--status-forgotten);
  color: #fff;
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* Main Container */
.main-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 20px 80px;
}

.nav-tabs {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border-subtle);
  padding-bottom: 12px;
  overflow-x: auto;
}

.nav-tab {
  padding: 7px 14px;
  border-radius: 8px;
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all var(--transition);
  white-space: nowrap;
}

.nav-tab:hover {
  background: var(--bg-surface-hover);
  color: var(--text-primary);
}

.nav-tab.active {
  background: var(--bg-surface);
  color: var(--text-primary);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-subtle);
}

/* Subject Sections */
.subjects-grid {
  display: flex;
  flex-direction: column;
  gap: 28px;
}

.subject-section {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-sm);
}

.subject-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

.subject-title-group {
  display: flex;
  align-items: center;
  gap: 12px;
}

.subject-badge {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-weight: 700;
}

.subject-section[data-subject="Mathematics"] .subject-badge {
  background: var(--math-soft);
  color: var(--math-accent);
}
.subject-section[data-subject="Chemistry"] .subject-badge {
  background: var(--chem-soft);
  color: var(--chem-accent);
}
.subject-section[data-subject="Physics"] .subject-badge {
  background: var(--phys-soft);
  color: var(--phys-accent);
}

.subject-name {
  font-size: 1.125rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0;
}

.subject-meta {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.folders-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 12px;
}

.folder-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 14px 14px 16px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background: var(--bg-app);
  transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
}

.folder-card:hover {
  border-color: var(--border-strong);
  background: var(--bg-surface);
  box-shadow: var(--shadow-sm);
  transform: translateY(-1px);
}

.folder-click-area {
  flex: 1;
  min-width: 0;
  cursor: pointer;
}

.folder-name {
  font-weight: 600;
  font-size: 0.95rem;
  margin: 0 0 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.folder-stats {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.78rem;
  color: var(--text-secondary);
}

.folder-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.play-btn {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--text-primary);
  color: var(--bg-surface);
  display: grid;
  place-items: center;
  transition: transform var(--transition), opacity var(--transition);
}

.play-btn:hover {
  transform: scale(1.06);
}

.play-btn:disabled {
  opacity: 0.25;
  cursor: not-allowed;
  transform: none;
}

.folder-empty {
  padding: 20px;
  text-align: center;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-md);
  color: var(--text-muted);
  font-size: 0.875rem;
}

/* Folder View */
.folder-view-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 20px;
}

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.82rem;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.breadcrumb button:hover {
  color: var(--text-primary);
  text-decoration: underline;
}

.folder-title-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.folder-view-title {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0;
}

.progress-bar-track {
  width: 100%;
  height: 7px;
  background: var(--bg-muted);
  border-radius: 999px;
  overflow: hidden;
  margin-top: 8px;
}

.progress-bar-fill {
  height: 100%;
  background: var(--status-knew);
  border-radius: 999px;
  transition: width 300ms ease;
}

.cards-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 14px;
}

.flashcard-item {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
}

.flashcard-item:hover {
  border-color: var(--border-strong);
  box-shadow: var(--shadow-md);
}

.flashcard-item.dragging {
  opacity: 0.45;
  transform: scale(0.98);
}

.flashcard-item.drag-over {
  border-color: var(--accent-primary);
  box-shadow: 0 0 0 2px var(--accent-soft);
}

.card-preview-box {
  position: relative;
  aspect-ratio: 16 / 10;
  background: #ffffff;
  border-bottom: 1px solid var(--border-subtle);
  cursor: pointer;
  overflow: hidden;
}

.card-preview-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.card-index-pill {
  position: absolute;
  top: 10px;
  left: 10px;
  padding: 2px 8px;
  border-radius: 6px;
  background: rgba(25, 25, 24, 0.78);
  color: #fff;
  font-size: 0.72rem;
  font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
}

.card-item-footer {
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.diff-badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 0.73rem;
  font-weight: 600;
}

.diff-new { background: var(--status-new-bg); color: var(--status-new); }
.diff-knew { background: var(--status-knew-bg); color: var(--status-knew); }
.diff-difficult { background: var(--status-difficult-bg); color: var(--status-difficult); }
.diff-forgotten { background: var(--status-forgotten-bg); color: var(--status-forgotten); }

.card-item-actions {
  display: flex;
  align-items: center;
  gap: 2px;
}

.drag-handle {
  cursor: grab;
  color: var(--text-muted);
}

.drag-handle:active {
  cursor: grabbing;
}

/* Floating Action Button */
.fab {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 35;
  width: 58px;
  height: 58px;
  border-radius: 18px;
  background: var(--text-primary);
  color: var(--bg-surface);
  box-shadow: var(--shadow-lg);
  display: grid;
  place-items: center;
  transition: transform var(--transition);
}

.fab:hover {
  transform: scale(1.06);
}

/* Fullscreen Drawing Creator */
.creator-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--bg-app);
  display: flex;
  flex-direction: column;
}

.creator-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 16px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}

.step-pills {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-app);
  padding: 4px;
  border-radius: 10px;
  border: 1px solid var(--border-subtle);
}

.step-pill {
  padding: 5px 14px;
  border-radius: 7px;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-secondary);
}

.step-pill.active {
  background: var(--bg-surface);
  color: var(--text-primary);
  box-shadow: var(--shadow-sm);
}

.creator-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  overflow-x: auto;
  flex-shrink: 0;
}

.tool-group {
  display: flex;
  align-items: center;
  gap: 4px;
  padding-right: 10px;
  border-right: 1px solid var(--border-subtle);
}

.tool-group:last-child {
  border-right: none;
  padding-right: 0;
}

.tool-btn {
  height: 36px;
  min-width: 36px;
  padding: 0 9px;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-secondary);
}

.tool-btn:hover {
  background: var(--bg-surface-hover);
  color: var(--text-primary);
}

.tool-btn.active {
  background: var(--text-primary);
  color: var(--bg-surface);
}

.color-swatch {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid transparent;
  transition: transform 120ms ease;
}

.color-swatch.active {
  border-color: var(--text-primary);
  transform: scale(1.15);
  box-shadow: 0 0 0 2px var(--bg-surface) inset;
}

.creator-stage {
  flex: 1;
  position: relative;
  overflow: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: var(--bg-muted);
}

.canvas-paper-wrap {
  position: relative;
  background: #ffffff;
  border-radius: 12px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  transform-origin: center center;
  touch-action: none;
}

.drawing-canvas {
  display: block;
  touch-action: none;
  cursor: crosshair;
}

.creator-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 16px;
  background: var(--bg-surface);
  border-top: 1px solid var(--border-subtle);
  flex-shrink: 0;
}

/* Study Mode */
.study-overlay {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: var(--bg-app);
  display: flex;
  flex-direction: column;
}

.study-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 20px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
}

.study-progress-line {
  height: 4px;
  background: var(--bg-muted);
  width: 100%;
}

.study-progress-fill {
  height: 100%;
  background: var(--accent-primary);
  transition: width 240ms ease;
}

.study-stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-y: auto;
  gap: 16px;
}

.study-card-shell {
  width: 100%;
  max-width: 860px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  animation: fadeSlide 220ms ease;
}

@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.study-face {
  background: #ffffff;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  position: relative;
}

.study-face-label {
  position: absolute;
  top: 12px;
  left: 14px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  background: rgba(25, 25, 24, 0.08);
  color: #191918;
}

.study-canvas {
  width: 100%;
  aspect-ratio: 16 / 10;
  display: block;
}

.study-answer-wrap {
  animation: revealCard 240ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

@keyframes revealCard {
  from { opacity: 0; transform: translateY(10px) scale(0.99); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.study-controls {
  padding: 14px 20px;
  background: var(--bg-surface);
  border-top: 1px solid var(--border-subtle);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.feedback-group {
  display: flex;
  align-items: center;
  gap: 8px;
}

.fb-btn {
  height: 42px;
  padding: 0 16px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 0.875rem;
  transition: transform var(--transition);
}

.fb-btn:hover { transform: translateY(-1px); }
.fb-forgot { background: var(--status-forgotten-bg); color: var(--status-forgotten); }

// === sound-fx.js ===
// Aesthetic Web Audio API Sound Engine (Creamy/Thocky Keypress + Soft Chimes)
// Zero external audio files required.

const SOUND_PREF_KEY = "jee_recall_sound_enabled";

class SoundEngine {
  constructor() {
    this.ctx = null;
    this.enabled = true;
    try {
      const saved = localStorage.getItem(SOUND_PREF_KEY);
      if (saved !== null) this.enabled = saved === "true";
    } catch (_) {}
  }

  _ensureContext() {
    if (!this.enabled) return null;
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;
      this.ctx = new AudioCtx();
    }
    if (this.ctx.state === "suspended") {
      this.ctx.resume().catch(() => {});
    }
    return this.ctx;
  }

  toggle() {
    this.enabled = !this.enabled;
    try {
      localStorage.setItem(SOUND_PREF_KEY, String(this.enabled));
    } catch (_) {}
    if (this.enabled) this.playCreamyTap();
    return this.enabled;
  }

  // Trending "Creamy + Thocky" mechanical key press
  playCreamyTap() {
    const ctx = this._ensureContext();
    if (!ctx) return;
    const now = ctx.currentTime;

    // Warm thock body (low-mid pitch drop)
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(240, now);
    osc.frequency.exponentialRampToValueAtTime(95, now + 0.045);

    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.14, now + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.052);

    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(850, now);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.055);

    // Subtle muted keycap transient
    const bufSize = Math.floor(ctx.sampleRate * 0.014);
    const buffer = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.35));
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const nFilter = ctx.createBiquadFilter();
    nFilter.type = "bandpass";
    nFilter.frequency.setValueAtTime(1100, now);
    nFilter.Q.setValueAtTime(1.4, now);
    const nGain = ctx.createGain();
    nGain.gain.setValueAtTime(0.06, now);
    nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.014);

    noise.connect(nFilter);
    nFilter.connect(nGain);
    nGain.connect(ctx.destination);
    noise.start(now);
  }

  // Ultra-soft marbly UI tap
  playSoftClick() {
    const ctx = this._ensureContext();
    if (!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(460, now);
    osc.frequency.exponentialRampToValueAtTime(260, now + 0.028);
    gain.gain.setValueAtTime(0.07, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.032);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.035);
  }

  // Gentle marimba-like reveal chime (Space / Show Answer)
  playRevealChime() {
    const ctx = this._ensureContext();
    if (!ctx) return;
    const now = ctx.currentTime;
    [523.25, 659.25].forEach((freq, i) => {
      const t = now + i * 0.055;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.linearRampToValueAtTime(0.08, t + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.19);
    });
  }

  // Warm ascending success chime (Knew It / Save)
  playSuccessChime() {
    const ctx = this._ensureContext();
    if (!ctx) return;
    const now = ctx.currentTime;
    [587.33, 880].forEach((freq, i) => {
      const t = now + i * 0.065;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.linearRampToValueAtTime(0.08, t + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.21);
    });
  }

// Cloud Firestore Data Layer + IndexedDB Offline Cache
// Hierarchy: users/{userId}/subjects/{subject}/folders/{folderId}/cards/{cardId}
const SUBJECTS = ["Mathematics", "Chemistry", "Physics"];

const IDB_NAME = "jee_recall_cache";
const IDB_VERSION = 1;

function openIDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject(new Error("IndexedDB unavailable"));
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("folders")) {
        db.createObjectStore("folders", { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains("cards")) {
        db.createObjectStore("cards", { keyPath: "id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbGetAll(storeName) {
  try {
    const db = await openIDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, "readonly");
      const req = tx.objectStore(storeName).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  } catch (_) {
    return [];
  }
}

async function idbPut(storeName, item) {
  try {
    const db = await openIDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, "readwrite");
      tx.objectStore(storeName).put(item);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch (_) {}
}

async function idbDelete(storeName, id) {
  try {
    const db = await openIDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, "readwrite");
      tx.objectStore(storeName).delete(id);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch (_) {}
}

async function idbClearAll() {
  try {
    const db = await openIDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(["folders", "cards"], "readwrite");

  "#18181b", // Ink Black

  "#dc2626", // Crimson
  "#059669", // Emerald

      ctx.moveTo(0, y);
      ctx.lineTo(w, y);

    ctx.stroke();

    ctx.fillStyle = "#cbd5e1";

      const prevMidY = (prev.y + curr.y) / 2;
      ctx.moveTo(prevMidX, prevMidY);

      undoStack: [],
      redoStack: [],
      bg: cardData?.answerBg || "plain"
    };

    const availH = Math.max(220, (stage?.clientHeight || window.innerHeight - 200) - 36);

    const aspect = LOGICAL_W / LOGICAL_H;

    let baseH = baseW / aspect;
    if (baseH > availH) {
      baseH = availH;
      baseW = baseH * aspect;

    const cssW = Math.round(baseW * this.zoom);
    const cssH = Math.round(baseH * this.zoom);
    const dpr = Math.min(window.devicePixelRatio || 1, 3);

    wrap.style.width = `${cssW}px`;
    wrap.style.height = `${cssH}px`;
    this.canvas.style.width = `${cssW}px`;
    this.canvas.style.height = `${cssH}px`;
    this.canvas.width = Math.round(cssW * dpr);
    this.canvas.height = Math.round(cssH * dpr);

  render() {

    this.ctx.scale(scaleX, scaleY);

  _notify() {
    if (this.onStateChange) this.onStateChange();

// Distraction-Free Flashcard Study Mode Controller
class StudySession {
  constructor({ folder, cards, startCardId = null, onUpdateCard, onUpdateFolder, onExit }) {
    this.folder = folder;
    this.originalCards = [...cards];
    this.deck = [...cards];
    this.randomized = false;
    this.revealed = false;
    this.onUpdateCard = onUpdateCard;
    this.onUpdateFolder = onUpdateFolder;
    this.onExit = onExit;

    if (startCardId) {
      const idx = this.deck.findIndex((c) => c.id === startCardId);
      this.index = idx >= 0 ? idx : 0;
    } else if (
      typeof folder.lastStudiedIndex === "number" &&
      folder.lastStudiedIndex >= 0 &&
      folder.lastStudiedIndex < this.deck.length
    ) {
      this.index = folder.lastStudiedIndex;
    } else {
      this.index = 0;
    }

    this.folder.studySessions = (this.folder.studySessions || 0) + 1;
    this.onUpdateFolder(this.folder);
  }

  currentCard() {
    return this.deck[this.index] || null;
  }

  toggleRandomizer() {
    const currentId = this.currentCard()?.id;
    this.randomized = !this.randomized;

    if (this.randomized) {
      // Fisher-Yates shuffle without repeating until deck exhausted
      const rest = this.originalCards.filter((c) => c.id !== currentId);
      for (let i = rest.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [rest[i], rest[j]] = [rest[j], rest[i]];
      }
      const current = this.originalCards.find((c) => c.id === currentId);
      this.deck = current ? [current, ...rest] : rest;
      this.index = 0;
    } else {
      this.deck = [...this.originalCards];
      const idx = this.deck.findIndex((c) => c.id === currentId);
      this.index = idx >= 0 ? idx : 0;
    }
    this.revealed = false;
  }

  reveal() {
    this.revealed = true;
  }

  next() {
    if (this.index < this.deck.length - 1) {
      this.index++;
      this.revealed = false;
      this._persistPosition();
      return true;
    }
    return false;
  }

  prev() {
    if (this.index > 0) {
      this.index--;
      this.revealed = false;
      this._persistPosition();
      return true;
    }
    return false;
  }

  async rateCard(difficulty) {
    const card = this.currentCard();
    if (!card) return;
    card.difficulty = difficulty;
    card.lastReviewed = Date.now();
    card.reviewCount = (card.reviewCount || 0) + 1;
    card.updatedAt = Date.now();
    await this.onUpdateCard(card);
    if (this.index < this.deck.length - 1) {
      this.next();
    }
  }

  _persistPosition() {
    if (!this.randomized) {
      this.folder.lastStudiedIndex = this.index;
      this.onUpdateFolder(this.folder);
    }
  }

  renderCanvases(qCanvas, aCanvas) {
    const card = this.currentCard();
    if (!card) return;
    renderStrokesToCanvas(qCanvas, card.questionStrokes || [], card.questionBg || "plain");
    if (this.revealed && aCanvas) {
      renderStrokesToCanvas(aCanvas, card.answerStrokes || [], card.answerBg || "plain");
    }
  }
}

    const sFolders = folders.filter((f) => f.subject === subject);
    const sCards = cards.filter((c) => c.subject === subject);
    const knew = sCards.filter((c) => c.difficulty === "knew").length;
    const difficult = sCards.filter((c) => c.difficulty === "difficult").length;
    const forgotten = sCards.filter((c) => c.difficulty === "forgotten").length;
    const studied = sCards.filter((c) => (c.reviewCount || 0) > 0 || c.difficulty !== "new").length;
    const masteryPct = sCards.length ? Math.round((knew / sCards.length) * 100) : 0;

    return {
      subject,
      foldersCount: sFolders.length,
      cardsCount: sCards.length,
      studied,
      knew,
      difficult,
      forgotten,
      masteryPct
    };
  });

  const byFolder = folders.map((f) => {
    const fCards = cards.filter((c) => c.folderId === f.id);
    const knew = fCards.filter((c) => c.difficulty === "knew").length;
    const difficult = fCards.filter((c) => c.difficulty === "difficult").length;
    const forgotten = fCards.filter((c) => c.difficulty === "forgotten").length;
    const masteryPct = fCards.length ? Math.round((knew / fCards.length) * 100) : 0;

    return {
      id: f.id,
      name: f.name,
      subject: f.subject,
      cardsCount: fCards.length,
      knew,
      difficult,
      forgotten,
      sessions: f.studySessions || 0,
      masteryPct
    };
  });

  return {
    totalFolders,
    totalCards,
    cardsStudied,
    knewCount,
    difficultCount,
    forgottenCount,
    totalSessions,
    bySubject,
    byFolder
  };
}

function updateSyncBadge(status) {
  const pill = $("syncStatusPill");
  const txt = $("syncStatusText");
  pill.classList.remove("offline", "local", "syncing");
  if (!navigator.onLine) {
    pill.classList.add("offline");
    txt.textContent = "Offline (Cached)";
    return;
  }
  if (!state.repo.isCloudActive()) {
    pill.classList.add("local");
    txt.textContent = state.firebase?.ready ? "Sign in to Sync" : "Local Preview";
    return;
  }
  if (status === "syncing") {
    pill.classList.add("syncing");
    txt.textContent = "Syncing...";
  } else if (status === "offline") {
    pill.classList.add("offline");
    txt.textContent = "Sync Paused";
  } else {
    txt.textContent = "Cloud Synced";
  }
}

// Navigation
function setView(view, folderId = null) {

  if (folderId !== null) state.activeFolderId = folderId;

  document.querySelectorAll(".nav-tab").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.view === view);
  });

  $("dashboardView").classList.toggle("hidden", view !== "dashboard");
  $("folderView").classList.toggle("hidden", view !== "folder");
  $("analyticsView").classList.toggle("hidden", view !== "analytics");
  $("setupView").classList.toggle("hidden", view !== "setup");
  $("fabAddCard").classList.toggle("hidden", view !== "folder");

  if (view === "dashboard") renderDashboard();
  if (view === "folder") renderFolderView();
  if (view === "analytics") renderAnalytics();
  if (view === "setup") renderSetupView();
}

function getFolderCards(folderId) {
  const folder = state.folders.find((f) => f.id === folderId);
  const raw = state.cards.filter((c) => c.folderId === folderId);
  if (!folder || !Array.isArray(folder.cardOrder) || folder.cardOrder.length === 0) {
    return raw.sort((a, b) => (a.position || 0) - (b.position || 0));
  }
  const orderMap = new Map(folder.cardOrder.map((id, i) => [id, i]));
  return raw.sort((a, b) => {
    const ia = orderMap.has(a.id) ? orderMap.get(a.id) : 999999;
    const ib = orderMap.has(b.id) ? orderMap.get(b.id) : 999999;
    return ia - ib || (a.position || 0) - (b.position || 0);
  });
}

async function moveFolderUp(folderId) {
  const folder = state.folders.find((f) => f.id === folderId);
  if (!folder) return;
  const list = state.folders
    .filter((f) => f.subject === folder.subject)
    .sort((a, b) => (a.position || 0) - (b.position || 0));
  const idx = list.findIndex((f) => f.id === folderId);
  if (idx <= 0) return;
  [list[idx - 1], list[idx]] = [list[idx], list[idx - 1]];
  list.forEach((f, i) => (f.position = i));
  renderDashboard();
  await Promise.all(list.map((f) => state.repo.saveFolder(f)));
}

// Card Creator & Draft Autosave
function getDraftKey() {
  return `jee_recall_draft_${state.activeFolderId}_${state.editingCardId || "new"}`;
}

function saveDraftToLocal() {
  if (!state.editor || !state.activeFolderId) return;
  try {
    const data = state.editor.exportData();
    localStorage.setItem(getDraftKey(), JSON.stringify(data));
    $("draftStatusLabel").textContent = "Draft autosaved";
  } catch (_) {}
}

function clearDraftLocal() {
  try {
    localStorage.removeItem(getDraftKey());
  } catch (_) {}
}

function openCardCreator(cardId = null) {
  state.editingCardId = cardId;
  const existing = cardId ? state.cards.find((c) => c.id === cardId) : null;

  let initialData = existing;
  if (!existing) {
    try {
      const rawDraft = localStorage.getItem(getDraftKey());
      if (rawDraft) {
        const parsed = JSON.parse(rawDraft);
        if (parsed.questionStrokes?.length || parsed.answerStrokes?.length) {
          initialData = parsed;
          showToast("Restored unsaved draft");
        }
      }
    } catch (_) {}
  }

  $("creatorTitle").textContent = existing ? "Edit Flashcard" : "New Handwritten Flashcard";
  $("creatorOverlay").classList.remove("hidden");

  if (!state.editor) {
    state.editor = new HandwrittenEditor($("drawingCanvas"), () => {
      syncCreatorUI();
      saveDraftToLocal();
    });
  }
  state.editor.loadCard(initialData);
  syncCreatorUI();
}

function syncCreatorUI() {
  if (!state.editor) return;
  const isQ = state.editor.activeSide === "question";
  $("stepQuestionBtn").classList.toggle("active", isQ);
  $("stepAnswerBtn").classList.toggle("active", !isQ);
  $("creatorPrevBtn").disabled = isQ;
  $("creatorNextBtn").disabled = !isQ;
  $("paperBgSelect").value = state.editor.getSideState().bg;
  $("zoomResetBtn").textContent = `${Math.round(state.editor.zoom * 100)}%`;
  $("stylusOnlyBtn").classList.toggle("active", state.editor.stylusOnly);

  document.querySelectorAll(".tool-btn[data-tool]").forEach((b) => {
    b.classList.toggle("active", b.dataset.tool === state.editor.tool);
  });
}

function requestCloseCreator() {
  if (state.editor && state.editor.dirty) {
    openModal(
      `
      <h3 class="modal-title">Discard Unsaved Changes?</h3>
      <p style="color:var(--text-secondary);font-size:0.9rem;margin:0 0 18px;">
        You have unsaved handwritten strokes on this flashcard.
      </p>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button type="button" class="btn btn-secondary" id="modalCancelBtn">Keep Editing</button>
        <button type="button" class="btn btn-danger" id="modalConfirmBtn">Discard</button>
      </div>
    `,
      (el) => {
        el.querySelector("#modalCancelBtn").addEventListener("click", closeModal);
        el.querySelector("#modalConfirmBtn").addEventListener("click", () => {
          clearDraftLocal();
          closeModal();
          $("creatorOverlay").classList.add("hidden");
        });
      }
    );
  } else {
    $("creatorOverlay").classList.add("hidden");
  }
}

async function saveCreatorCard() {
  const folder = state.folders.find((f) => f.id === state.activeFolderId);
  if (!folder || !state.editor) return;

  const data = state.editor.exportData();
  if (data.questionStrokes.length === 0 && data.answerStrokes.length === 0) {
    showToast("Draw something on the Question or Answer canvas before saving.");
    return;
  }

  const now = Date.now();
  let card;
  if (state.editingCardId) {
    card = state.cards.find((c) => c.id === state.editingCardId);
    if (card) {
      card.questionStrokes = data.questionStrokes;
      card.answerStrokes = data.answerStrokes;
      card.questionBg = data.questionBg;
      card.answerBg = data.answerBg;
      card.updatedAt = now;
    }
  } else {
    const folderCards = getFolderCards(folder.id);
    card = {
      id: generateId("crd"),
      folderId: folder.id,
      subject: folder.subject,
      ...data,
      position: folderCards.length,
      difficulty: "new",
      lastReviewed: null,
      reviewCount: 0,
      createdAt: now,
      updatedAt: now
    };
    state.cards.push(card);
    folder.cardOrder = [...(folder.cardOrder || []), card.id];
    folder.updatedAt = now;
  }

  clearDraftLocal();
  state.editor.dirty = false;
  $("creatorOverlay").classList.add("hidden");
  renderFolderView();

  try {
    await state.repo.saveCard(card);
    await state.repo.saveFolder(folder);
    soundFX.playSuccessChime();
    showToast("Flashcard saved");
  } catch (err) {
    showToast(`Saved locally; sync error: ${err.message}`);
  }
}

// Study Mode
function startStudy(folderId, startCardId = null) {
  const folder = state.folders.find((f) => f.id === folderId);
  const cards = getFolderCards(folderId);
  if (!folder || cards.length === 0) {
    showToast("Add at least one flashcard to start studying.");

  state.study = new StudySession({
    folder,
    cards,
    startCardId,
    onUpdateCard: (c) => state.repo.saveCard(c),
    onUpdateFolder: (f) => state.repo.saveFolder(f),
    onExit: () => {
      $("studyOverlay").classList.add("hidden");
      state.study = null;
      if (state.view === "folder") renderFolderView();

  $("studyOverlay").classList.remove("hidden");
  renderStudyFrame();
}

function renderStudyFrame() {
  const s = state.study;
  if (!s) return;
  const total = s.deck.length;
  const currentNum = s.index + 1;
  $("studyCounter").textContent = `${currentNum} / ${total}`;
  $("studyProgressBar").style.width = `${Math.round((currentNum / total) * 100)}%`;
  $("studyRandomBtn").textContent = `Shuffle: ${s.randomized ? "On" : "Off"}`;
  $("studyRandomBtn").classList.toggle("btn-primary", s.randomized);
  $("studyRandomBtn").classList.toggle("btn-secondary", !s.randomized);

  $("studyPrevBtn").disabled = s.index === 0;
  $("studyNextBtn").disabled = s.index === total - 1;

  $("studyAnswerWrap").classList.toggle("hidden", !s.revealed);
  $("studyRevealWrap").classList.toggle("hidden", s.revealed);
  $("studyFeedbackWrap").classList.toggle("hidden", !s.revealed);

  requestAnimationFrame(() => {
    s.renderCanvases($("studyQuestionCanvas"), $("studyAnswerCanvas"));
  });
}

// Auth Modal
function formatAuthError(err) {
  const code = err?.code || "";
  if (code === "auth/operation-not-allowed") {
    return "This sign-in method isn't enabled yet. In Firebase Console → Authentication → Sign-in method, enable Email/Password (or Google).";
  }
  if (code === "auth/unauthorized-domain") {
    const host = window.location.hostname || "this preview domain";
    return `Domain "${host}" is not authorized for Google Sign-In. Use Email/Password below, or add "${host}" in Firebase Console → Authentication → Settings → Authorized domains.`;
  }
  if (code === "auth/popup-blocked" || code === "auth/operation-not-supported-in-this-environment" || code === "auth/cancelled-popup-request") {
    return "Popup sign-in is blocked in this embedded preview. Use Email/Password sign-in above, or open the deployed Firebase Hosting URL.";
  }
  if (code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found") {
    return "Invalid email or password. If you haven't registered yet, click 'Create Account'.";
  }
  if (code === "auth/email-already-in-use") {
    return "An account with this email already exists. Click 'Sign In' instead.";
  }
  if (code === "auth/weak-password") {
    return "Password must be at least 6 characters long.";
  }
  if (code === "auth/invalid-email") {
    return "Please enter a valid email address.";
  }
  return err?.message || "Authentication failed. Please check your Firebase settings.";
}

    <div id="authErrorBox" class="hidden" style="margin-bottom:12px;padding:10px 12px;border-radius:10px;background:var(--status-forgotten-bg);color:var(--status-forgotten);font-size:0.82rem;line-height:1.45;"></div>
    <div class="form-field">
      <label class="form-label" for="authEmail">Email</label>
      <input type="email" id="authEmail" class="form-input" placeholder="you@example.com" autocomplete="email" />
    </div>
    <div class="form-field">
      <label class="form-label" for="authPass">Password</label>
      <input type="password" id="authPass" class="form-input" placeholder="At least 6 characters" autocomplete="current-password" />
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <button type="button" class="btn btn-primary" id="emailSignInBtn">Sign In</button>
      <button type="button" class="btn btn-secondary" id="emailSignUpBtn">Create Account</button>
      <button type="button" class="btn btn-secondary" id="googleSignInBtn">Continue with Google</button>
      <button type="button" class="btn btn-secondary" id="authCancelBtn" style="margin-top:4px;">Cancel</button>
    </div>
  `,
    (el) => {
      const { auth, authApi } = state.firebase;
      const errBox = el.querySelector("#authErrorBox");
      const emailInput = el.querySelector("#authEmail");
      const passInput = el.querySelector("#authPass");
      const buttons = [
        el.querySelector("#emailSignInBtn"),
        el.querySelector("#emailSignUpBtn"),
        el.querySelector("#googleSignInBtn")
      ];

      const setBusy = (busy) => buttons.forEach((b) => (b.disabled = busy));
      const showAuthErr = (err) => {
        errBox.textContent = typeof err === "string" ? err : formatAuthError(err);
        errBox.classList.remove("hidden");
      };

      const withTimeout = (promise, ms = 15000) =>
        Promise.race([
          promise,
          new Promise((_, reject) =>
            setTimeout(() => reject(new Error("Request timed out. Check your internet connection and verify Email/Password is enabled in Firebase Console.")), ms)
          )
        ]);

      el.querySelector("#emailSignInBtn").addEventListener("click", async () => {
        errBox.classList.add("hidden");

        setBusy(true);
        const btn = el.querySelector("#emailSignInBtn");
        btn.textContent = "Signing in...";
        try {
          await withTimeout(authApi.signInWithEmailAndPassword(auth, email, pass));
          closeModal();
          showToast("Signed in & syncing");
        } catch (err) {
          showAuthErr(err);
        } finally {
          btn.textContent = "Sign In";
          setBusy(false);
        }
      });

      el.querySelector("#emailSignUpBtn").addEventListener("click", async () => {
        errBox.classList.add("hidden");
        const email = emailInput.value.trim();
        const pass = passInput.value;
        if (!email || pass.length < 6) return showAuthErr("Enter a valid email and a password of at least 6 characters.");
        setBusy(true);
        const btn = el.querySelector("#emailSignUpBtn");
        btn.textContent = "Creating account...";
        try {
          await withTimeout(authApi.createUserWithEmailAndPassword(auth, email, pass));
          closeModal();
          showToast("Account created & syncing");
        } catch (err) {
          showAuthErr(err);
        } finally {
          btn.textContent = "Create Account";
          setBusy(false);
        }
      });

      el.querySelector("#authCancelBtn").addEventListener("click", closeModal);

      el.querySelector("#googleSignInBtn").addEventListener("click", async () => {
        errBox.classList.add("hidden");
        if (window.location.hostname === "appassets.androidplatform.net") {
          showAuthErr("Google Sign-In is blocked inside Android WebView. Use Email & Password above (click Create Account first) or open the hosted app in Chrome.");
          return;
        }
        setBusy(true);
        try {
          const provider = new authApi.GoogleAuthProvider();
          const timeoutPromise = new Promise((_, reject) =>
            setTimeout(() => reject({ code: "auth/popup-blocked" }), 12000)
          );
          await Promise.race([authApi.signInWithPopup(auth, provider), timeoutPromise]);
          closeModal();
          showToast("Signed in with Google");
        } catch (err) {
          showAuthErr(err);
        } finally {
          setBusy(false);
        }
      });
    }
  );
}

async function bootstrapFirebase() {
  setView("dashboard");
  // Load local cache & update dashboard without blocking initial paint
  const localData = await state.repo.loadAllData();
  state.folders = localData.folders;
  state.cards = localData.cards;
  setView("dashboard");

  state.firebase = await initFirebaseServices();
  if (state.firebase.ready) {
    try {
      await state.firebase.authApi.getRedirectResult(state.firebase.auth);
    } catch (redirErr) {
      showToast(formatAuthError(redirErr));
    }
    state.firebase.authApi.onAuthStateChanged(state.firebase.auth, async (user) => {
      state.user = user;
      if (user) {
        $("accountBtn").textContent = user.email ? user.email.split("@")[0] : "Account";
        await state.repo.attachFirebase(state.firebase.db, user.uid);
        const data = await state.repo.loadAllData();
        state.folders = data.folders;
        state.cards = data.cards;
        updateSyncBadge(data.error ? "offline" : "synced");
        if (data.error) showToast("Firestore permissions/network issue: " + data.error);
      } else {
        $("accountBtn").textContent = "Sign In";
        state.repo.detachFirebase();
        updateSyncBadge("local");
      }
      setView(state.view, state.activeFolderId);
    });
  } else {
    updateSyncBadge("local");
  }
}

function bindGlobalEvents() {
  state.repo.onSyncChange = (status) => updateSyncBadge(status);
  window.addEventListener("online", () => updateSyncBadge("synced"));
  window.addEventListener("offline", () => updateSyncBadge("offline"));

  updateSoundBtn();
  $("soundToggleBtn").addEventListener("click", () => {
    soundFX.toggle();
    updateSoundBtn();
  });

  // Aesthetic creamy/thocky sound on key presses & button taps
  document.addEventListener("keydown", (e) => {
    if (e.repeat) return;
    if (e.code === "Space" && state.study && !$("studyOverlay").classList.contains("hidden") && !state.study.revealed) {
      return; // handled by reveal chime
    }
    if (["Shift", "Control", "Alt", "Meta", "CapsLock", "Tab"].includes(e.key)) return;
    soundFX.playCreamyTap();
  });

  document.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn || btn.disabled) return;
    if (btn.id === "soundToggleBtn" || btn.id === "studyRevealBtn" || btn.classList.contains("fb-btn")) return;
    soundFX.playSoftClick();
  });

  $("brandHomeBtn").addEventListener("click", () => setView("dashboard"));
  $("themeToggleBtn").addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
  });
  $("syncStatusPill").addEventListener("click", () => setView("setup"));
  $("accountBtn").addEventListener("click", openAccountModal);
  $("backupBtn").addEventListener("click", openBackupModal);

  document.querySelectorAll(".nav-tab").forEach((tab) => {
    tab.addEventListener("click", () => setView(tab.dataset.view));
  });

  $("globalSearchInput").addEventListener("input", (e) => {
    state.searchQuery = e.target.value;
    $("searchClearBtn").classList.toggle("hidden", !state.searchQuery);
    if (state.view !== "dashboard") setView("dashboard");
    else renderDashboard();
  });

  $("searchClearBtn").addEventListener("click", () => {
    state.searchQuery = "";
    $("globalSearchInput").value = "";
    $("searchClearBtn").classList.add("hidden");
    renderDashboard();
  });

  // Dashboard delegation
  $("dashboardView").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const { action, id, subject } = btn.dataset;
    if (action === "add-folder") promptCreateFolder(subject);
    if (action === "open-folder") setView("folder", id);
    if (action === "play-folder") startStudy(id);
    if (action === "rename-folder") promptRenameFolder(id);
    if (action === "delete-folder") promptDeleteFolder(id);
    if (action === "move-folder-up") moveFolderUp(id);
  });

  // Folder view delegation & drag-and-drop
  $("folderView").addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const { action, id } = btn.dataset;
    if (action === "study-from-card") startStudy(state.activeFolderId, id);
    if (action === "edit-card") openCardCreator(id);
    if (action === "delete-card") promptDeleteCard(id);
    if (action === "move-card-up" || action === "move-card-down") {
      const cards = getFolderCards(state.activeFolderId);
      const ids = cards.map((c) => c.id);
      const idx = ids.indexOf(id);
      const target = action === "move-card-up" ? idx - 1 : idx + 1;
      if (target >= 0 && target < ids.length) {
        [ids[idx], ids[target]] = [ids[target], ids[idx]];
        await reorderFolderCards(state.activeFolderId, ids);
      }
    }
  });

  $("folderView").addEventListener("dragstart", (e) => {
    const item = e.target.closest(".flashcard-item");
    if (!item) return;
    state.dragCardId = item.dataset.cardId;
    item.classList.add("dragging");
  });

  $("folderView").addEventListener("dragend", (e) => {
    const item = e.target.closest(".flashcard-item");
    if (item) item.classList.remove("dragging");
    document.querySelectorAll(".flashcard-item.drag-over").forEach((el) => el.classList.remove("drag-over"));
  });

  $("folderView").addEventListener("dragover", (e) => {
    const item = e.target.closest(".flashcard-item");
    if (!item || item.dataset.cardId === state.dragCardId) return;
    e.preventDefault();
    item.classList.add("drag-over");
  });

  $("folderView").addEventListener("dragleave", (e) => {
    const item = e.target.closest(".flashcard-item");
    if (item) item.classList.remove("drag-over");
  });

  $("folderView").addEventListener("drop", async (e) => {
    const targetItem = e.target.closest(".flashcard-item");
    if (!targetItem || !state.dragCardId) return;
    e.preventDefault();
    const targetId = targetItem.dataset.cardId;
    if (targetId === state.dragCardId) return;

    const cards = getFolderCards(state.activeFolderId);
    const ids = cards.map((c) => c.id);
    const fromIdx = ids.indexOf(state.dragCardId);
    const toIdx = ids.indexOf(targetId);
    if (fromIdx === -1 || toIdx === -1) return;
    const [moved] = ids.splice(fromIdx, 1);
    ids.splice(toIdx, 0, moved);
    state.dragCardId = null;
    await reorderFolderCards(state.activeFolderId, ids);
  });

  $("fabAddCard").addEventListener("click", () => openCardCreator(null));

  // Creator Controls
  const palette = $("colorPaletteGroup");
  PRESET_COLORS.forEach((hex, i) => {
    const sw = document.createElement("button");
    sw.type = "button";
    sw.className = `color-swatch ${i === 0 ? "active" : ""}`;
    sw.style.backgroundColor = hex;
    sw.dataset.color = hex;
    sw.title = hex;
    sw.addEventListener("click", () => {
      if (!state.editor) return;
      state.editor.color = hex;
      if (state.editor.tool === "eraser") state.editor.tool = "pen";
      $("customColorInput").value = hex;
      palette.querySelectorAll(".color-swatch").forEach((s) => s.classList.toggle("active", s === sw));
      syncCreatorUI();
    });
    palette.insertBefore(sw, $("customColorInput"));
  });

  $("customColorInput").addEventListener("input", (e) => {
    if (!state.editor) return;
    state.editor.color = e.target.value;
    if (state.editor.tool === "eraser") state.editor.tool = "pen";
    palette.querySelectorAll(".color-swatch").forEach((s) => s.classList.remove("active"));
    syncCreatorUI();
  });

  document.querySelectorAll(".tool-btn[data-tool]").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (!state.editor) return;
      state.editor.tool = btn.dataset.tool;
      syncCreatorUI();
    });
  });

  $("brushSizeInput").addEventListener("input", (e) => {
    if (!state.editor) return;
    state.editor.brushSize = Number(e.target.value);
    $("brushSizeVal").textContent = e.target.value;
  });

  $("undoBtn").addEventListener("click", () => state.editor?.undo());
  $("redoBtn").addEventListener("click", () => state.editor?.redo());
  $("clearCanvasBtn").addEventListener("click", () => state.editor?.clearCurrent());
  $("zoomOutBtn").addEventListener("click", () => state.editor?.setZoom(state.editor.zoom - 0.2));
  $("zoomInBtn").addEventListener("click", () => state.editor?.setZoom(state.editor.zoom + 0.2));
  $("zoomResetBtn").addEventListener("click", () => state.editor?.setZoom(1));
  $("paperBgSelect").addEventListener("change", (e) => state.editor?.setPaperBg(e.target.value));
  $("stylusOnlyBtn").addEventListener("click", () => {
    if (!state.editor) return;
    state.editor.stylusOnly = !state.editor.stylusOnly;
    syncCreatorUI();
    showToast(state.editor.stylusOnly ? "Palm rejection: Stylus Only" : "Touch, Stylus & Mouse enabled");
  });

  $("stepQuestionBtn").addEventListener("click", () => {
    state.editor?.setSide("question");
    syncCreatorUI();
  });
  $("stepAnswerBtn").addEventListener("click", () => {
    state.editor?.setSide("answer");
    syncCreatorUI();
  });
  $("creatorPrevBtn").addEventListener("click", () => {
    state.editor?.setSide("question");
    syncCreatorUI();
  });
  $("creatorNextBtn").addEventListener("click", () => {
    state.editor?.setSide("answer");
    syncCreatorUI();
  });
  $("creatorSaveBtn").addEventListener("click", saveCreatorCard);
  $("creatorCloseBtn").addEventListener("click", requestCloseCreator);

  // Study Mode Controls
  $("studyExitBtn").addEventListener("click", () => state.study?.onExit());
  $("studyRandomBtn").addEventListener("click", () => {
    state.study?.toggleRandomizer();
    renderStudyFrame();
  });
  $("studyRevealBtn").addEventListener("click", () => {
    soundFX.playRevealChime();
    state.study?.reveal();
    renderStudyFrame();
  });
  $("studyPrevBtn").addEventListener("click", () => {
    if (state.study?.prev()) renderStudyFrame();
  });
  $("studyNextBtn").addEventListener("click", () => {
    if (state.study?.next()) renderStudyFrame();
  });
  document.querySelectorAll(".fb-btn[data-rate]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!state.study) return;
      if (btn.dataset.rate === "knew") soundFX.playSuccessChime();
      else soundFX.playSoftClick();
      await state.study.rateCard(btn.dataset.rate);
      renderStudyFrame();
    });
  });

  // Keyboard shortcuts for Study Mode
  document.addEventListener("keydown", (e) => {
    if (!state.study || $("studyOverlay").classList.contains("hidden")) return;
    if (e.code === "Space") {
      e.preventDefault();
      if (!state.study.revealed) {
        soundFX.playRevealChime();
        state.study.reveal();
        renderStudyFrame();
      }
    } else if (e.key === "ArrowLeft") {
      e.preventDefault();
      if (state.study.prev()) renderStudyFrame();
    } else if (e.key === "ArrowRight") {
      e.preventDefault();
      if (state.study.next()) renderStudyFrame();
    } else if (e.key === "Escape") {
      e.preventDefault();
      state.study.onExit();
    }
  });

  // Import JSON backup
  $("importFileInput").addEventListener("change", async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!Array.isArray(data.folders) || !Array.isArray(data.cards)) {
        throw new Error("Invalid backup structure");
      }
      state.folders = data.folders;
      state.cards = data.cards;
      await state.repo.replaceAllFromBackup(state.folders, state.cards);
      setView("dashboard");
      showToast(`Imported ${data.folders.length} folders and ${data.cards.length} cards`);
    } catch (err) {
      showToast(`Import failed: ${err.message}`);
    } finally {
      e.target.value = "";
    }
  });

  window.addEventListener("resize", () => {
    if (!$("creatorOverlay").classList.contains("hidden")) state.editor?.resizeAndRender();
    if (!$("studyOverlay").classList.contains("hidden")) renderStudyFrame();
  });

  $("modalBackdrop").addEventListener("click", (e) => {
    if (e.target === $("modalBackdrop")) closeModal();
  });
}

initTheme();
bindGlobalEvents();
bootstrapFirebase();

})();
</script>
</body>
</html>
